services:
  app:
    build: .
    image: sgu26-thuyet-minh:dev
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      # Ghi đè đường dẫn local bằng đường dẫn trong container (nằm trong named volume).
      DATABASE_URL: sqlite:////app/data/app.db
      AUDIO_DIR: /app/audio_files
    volumes:
      - app_data:/app/data
      - app_audio:/app/audio_files
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  app_data:
  app_audio:
