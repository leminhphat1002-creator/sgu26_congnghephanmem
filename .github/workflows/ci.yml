name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  lint:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Parse PowerShell scripts
        run: |
          Get-ChildItem -Path scripts,deploy -Filter *.ps1 -Recurse | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }

  test-backend:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=app --cov-report=term-missing

  test-postgres:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - run: python -m pip install -r requirements-dev.txt
      - name: Start native Windows PostgreSQL (CI database only)
        env:
          PGPASSWORD: root
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -U postgres -t 2
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'PostgreSQL is not ready' }
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -U postgres bat_trang_test
          if ($LASTEXITCODE -ne 0) { throw 'Could not create disposable CI database' }
      - name: Verify migrations, bootstrap, login and dashboard
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:root@127.0.0.1:5432/bat_trang_test
        run: python -m pytest -q tests/test_hosted_postgres.py

  build-windows:
    runs-on: windows-2025
    needs: [lint, test-backend, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build Windows ZIP with dependency wheels
        run: python -m scripts.build_release --revision "$env:GITHUB_SHA" --output "$env:RUNNER_TEMP/bat-trang-windows.zip"
      - name: Test actual packaged app with offline installation
        run: python -m scripts.smoke_release --revision "$env:GITHUB_SHA" --archive "$env:RUNNER_TEMP/bat-trang-windows.zip"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: windows-package-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bat-trang-windows.zip
            ${{ runner.temp }}/bat-trang-windows.zip.sha256
          retention-days: 7
          compression-level: 0
          overwrite: true
