
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GPS Audio Guide - Thuyết minh tự động</title>

    <link rel="stylesheet" href="/static/app/style.css">
    <script src="/static/app/script.js" defer></script>
</head>

<body>
    <div class="container">
        <header class="header">
            <span class="eyebrow">GPS AUDIO GUIDE</span>
            <h1>Thuyết minh du lịch tự động</h1>
            <p>
                Khám phá địa điểm xung quanh bạn bằng GPS,
                Wikipedia và công nghệ giọng nói.
            </p>
        </header>

        <main>
            <section class="card">
                <h2>Vị trí của bạn</h2>
                <p class="description">
                    Sử dụng GPS hiện tại hoặc nhập tọa độ để thử nghiệm.
                </p>

                <div class="form-grid">
                    <div class="field">
                        <label for="latitude">Vĩ độ (Latitude)</label>
                        <input
                            type="number"
                            id="latitude"
                            step="any"
                            min="-90"
                            max="90"
                            value="10.7769"
                        >
                    </div>

                    <div class="field">
                        <label for="longitude">Kinh độ (Longitude)</label>
                        <input
                            type="number"
                            id="longitude"
                            step="any"
                            min="-180"
                            max="180"
                            value="106.6955"
                        >
                    </div>
                </div>

                <button
                    type="button"
                    id="gpsButton"
                    class="secondary-button"
                >
                    Lấy vị trí GPS hiện tại
                </button>

                <div class="field language-field">
                    <label for="language">Ngôn ngữ thuyết minh</label>

                    <select id="language">
                        <option value="vi">Tiếng Việt</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                    </select>
                </div>

                <button
                    type="button"
                    id="detectButton"
                    class="primary-button"
                >
                    Phát hiện và thuyết minh
                </button>

                <p id="statusMessage" role="status" aria-live="polite"></p>
            </section>

            <section class="card result-card" id="resultCard" hidden>
                <span class="eyebrow">KẾT QUẢ PHÁT HIỆN</span>

                <h2 id="locationName"></h2>

                <div class="metadata">
                    <span id="distanceInfo"></span>
                    <span id="languageInfo"></span>
                </div>

                <h3>Nội dung thuyết minh</h3>
                <p id="narrationText"></p>

                <div id="audioSection" hidden>
                    <h3>Nghe thuyết minh</h3>

                    <audio
                        id="audioPlayer"
                        controls
                        preload="none"
                    ></audio>

                    <p id="cacheInfo" class="description"></p>
                </div>
            </section>
        </main>

        <footer>
            Đồ án Công nghệ phần mềm - GPS Audio Guide
        </footer>
    </div>
</body>
</html>
