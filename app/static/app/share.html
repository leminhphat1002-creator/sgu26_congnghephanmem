<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title data-i18n="Quét QR khám phá Bát Tràng">Quét QR khám phá Bát Tràng</title>
    <link rel="stylesheet" href="/static/app/style.css">
    <script src="/static/app/i18n.js?v=20261025-i18n1" defer></script>
    <script src="/static/app/share.js?v=20261025-i18n1" defer></script>
</head>
<body>
<main class="container share-page">
    <header class="header">
        <span class="eyebrow">BÁT TRÀNG AUDIO GUIDE</span>
        <h1 data-i18n="Quét mã. Bắt đầu khám phá.">Quét mã. Bắt đầu khám phá.</h1>
        <p data-i18n="Mở camera điện thoại, quét mã QR và nghe câu chuyện làng gốm.">Mở camera điện thoại, quét mã QR và nghe câu chuyện làng gốm.</p>
    </header>
    <section class="card qr-card">
        <img id="shareQr" src="/share/qr.svg" alt="Mã QR mở trang người dùng Bát Tràng" data-i18n-alt="Mã QR mở trang người dùng Bát Tràng" width="300" height="300">
        <p id="shareUrl"></p>
        <p id="shareHint" role="status" data-i18n="Đang kiểm tra đường dẫn…">Đang kiểm tra đường dẫn…</p>
        <div class="share-actions">
            <a class="primary-button button-link" href="/share/qr.png" download="bat-trang-qr.png" data-i18n="Tải mã QR">Tải mã QR</a>
            <button id="copyShare" class="secondary-button" type="button" data-i18n="Sao chép liên kết">Sao chép liên kết</button>
            <button id="printShare" class="secondary-button" type="button" data-i18n="In mã QR">In mã QR</button>
        </div>
        <a href="/" data-i18n="Vào trang khám phá">Vào trang khám phá</a>
    </section>
</main>
</body>
</html>
